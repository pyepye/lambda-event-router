AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Latcher full example - Cognito, EventBridge and S3 user avatars

Resources:
  # The bucket name is built with Sub rather than Ref. A Ref from the function would make the bucket
  # and the function depend on each other through the S3 notification.
  AvatarsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-${AWS::AccountId}-${AWS::Region}

  UserControllerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-user-controller
      RetentionInDays: 1

  UserController:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-user-controller
      CodeUri: dist/
      Handler: index.handler
      Runtime: nodejs24.x
      MemorySize: 1024
      Timeout: 15
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref UserControllerLogGroup
      Environment:
        Variables:
          BUCKET_NAME: !Sub ${AWS::StackName}-${AWS::AccountId}-${AWS::Region}
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub ${AWS::StackName}-${AWS::AccountId}-${AWS::Region}
      Events:
        UserPoolTriggers:
          Type: Cognito
          Properties:
            UserPool: !Ref UserPool
            Trigger:
              - PostConfirmation
              - CustomMessage
        OriginalCreated:
          Type: S3
          Properties:
            Bucket: !Ref AvatarsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: originals/
        OriginalRemoved:
          Type: S3
          Properties:
            Bucket: !Ref AvatarsBucket
            Events: s3:ObjectRemoved:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: originals/
        UserDeleted:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.cognito-idp
              detail-type:
                - AWS API Call via CloudTrail
              detail:
                eventName:
                  - AdminDeleteUser
                  - DeleteUser

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # EventBridge only receives "AWS API Call via CloudTrail" events while a trail is logging.
  TrailBucket:
    Type: AWS::S3::Bucket

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  BucketName:
    Value: !Ref AvatarsBucket
  TrailBucketName:
    Value: !Ref TrailBucket
  TrailName:
    Value: !Ref Trail
